name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .

  airflow-dag-validation:
    name: Validate Airflow DAG parses (real DagBag, not just syntax)
    needs: lint
    runs-on: ubuntu-latest
    # Only apache-airflow itself is needed here, not requirements.txt —
    # DagBag parsing executes the DAG file's top-level code (the
    # @dag/@task decorators wiring up the graph), not the task function
    # bodies (those only run when a real scheduler executes them), so
    # xgboost/mlflow/evidently aren't needed just to validate the graph.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: |
          pip install "apache-airflow==2.10.4" \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.4/constraints-3.12.txt"
      - name: Parse the DAG with a real DagBag
        env:
          AIRFLOW_HOME: /tmp/airflow_ci_home
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
          AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: "sqlite:////tmp/airflow_ci_home/airflow.db"
        run: |
          airflow db migrate
          python -c "
          from airflow.models import DagBag
          bag = DagBag(dag_folder='airflow/dags', include_examples=False)
          if bag.import_errors:
              print('Import errors found:')
              for path, err in bag.import_errors.items():
                  print(f'{path}: {err}')
              raise SystemExit(1)
          assert 'telecom_anomaly_pipeline' in bag.dags, f'DAG not found; got: {list(bag.dags)}'
          dag = bag.dags['telecom_anomaly_pipeline']
          expected_tasks = {
              'run_drift_check', 'decide_whether_to_retrain', 'skip_retrain',
              'generate_data', 'engineer_features', 'train_model', 'promote_model',
          }
          actual_tasks = set(dag.task_ids)
          assert actual_tasks == expected_tasks, f'Task mismatch: expected {expected_tasks}, got {actual_tasks}'
          print(f'DAG parsed cleanly with {len(dag.task_ids)} tasks: {sorted(dag.task_ids)}')
          "

  unit-tests:
    name: Unit tests (no model artifacts needed)
    needs: lint
    runs-on: ubuntu-latest
    # Real Redis for tests/test_shared_history.py (without it those tests skip).
    services:
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_TEST_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # Only the pure transformation/split/threshold logic — no trained
      # model required, so this runs on every PR regardless of whether
      # the pipeline below has been executed yet.
      - run: pytest tests/test_features.py tests/test_common.py tests/test_inference_log.py tests/test_promote.py tests/test_convert_to_onnx.py tests/test_query_triton.py tests/test_generate_data.py tests/test_repo_consistency.py tests/test_live_features.py tests/test_alerting.py tests/test_study_common.py tests/test_k8s_manifests.py tests/test_shared_history.py tests/test_k8s_traffic.py tests/test_replay_mlflow.py -v

  pipeline-and-integration-tests:
    name: Run real pipeline + API integration tests
    needs: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt

      # Runs the actual pipeline end-to-end with real xgboost (available
      # here, unlike the sandbox this repo was partly built in) so
      # test_api.py has a real model.json/scaler.pkl/metadata.json to
      # load. Using the scripts directly rather than `dvc repro` for now
      # since this repo doesn't have `dvc init` run yet (no .dvc/ dir
      # committed) — swap this step for `dvc repro` once that's done;
      # see README's DVC section.
      - name: Run data + feature + train pipeline
        run: |
          python data/generate_data.py
          python data/features.py
          python models/train.py

      - name: Run API integration tests
        run: pytest tests/test_api.py -v

      - name: Smoke-test the drift-detection pipeline (Evidently)
        # This is the ONLY place the evidently integration in
        # monitoring/drift_check.py gets exercised against the real
        # library before you run it yourself — it was written without
        # network access to install/verify evidently (see that file's
        # module docstring). If this step fails with the RuntimeError
        # about CANDIDATE_KEYS, that's the API-shape mismatch the
        # docstring warns about; check the uploaded debug-dump artifact
        # below and update monitoring/drift_check.py's CANDIDATE_KEYS.
        run: |
          uvicorn api.main:app --host 0.0.0.0 --port 8000 &
          API_PID=$!
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/health && break
            sleep 1
          done
          python scripts/generate_traffic.py --url http://localhost:8000 --requests 60 --sleep 0.02
          kill $API_PID
          python monitoring/drift_check.py --skip-push --min-current-rows 10

      - name: Upload drift report + debug dump (if any)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: drift-check-output
          path: |
            monitoring/reports/
          retention-days: 14
          if-no-files-found: ignore

      - name: Convert to ONNX + validate parity (Phase 6)
        # This is the ONLY place models/convert_to_onnx.py's onnxmltools
        # integration gets exercised against the real library before you
        # run it yourself — written without network access to verify
        # onnxmltools/onnxruntime (see that file's module docstring). If
        # this fails with the RuntimeError about a missing [N, 2] output,
        # that's the output-naming mismatch the docstring warns about;
        # check the printed "ONNX output(s)" line above the failure and
        # update triton_model_repository/telecom_anomaly_xgb/config.pbtxt's
        # output name to match.
        run: python models/convert_to_onnx.py

      - name: Upload ONNX model
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onnx-model
          path: models/model.onnx
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload trained model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts
          path: |
            models/model.json
            models/scaler.pkl
            models/metadata.json
            models/reference_features.csv
            models/feature_importance.csv

      - name: Upload MLflow tracking store
        # train.py logs to a local ./mlruns (no MLFLOW_TRACKING_URI is set
        # anywhere in this workflow), which otherwise evaporates when the
        # runner is torn down. Uploading it is what makes "download this
        # and run `mlflow ui --backend-store-uri ./mlruns`" actually
        # possible — without this step there is nowhere to see the real
        # XGBoost run's params/metrics after the job finishes.
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-tracking-store
          path: mlruns/
          retention-days: 14
          if-no-files-found: warn
          retention-days: 14

  docker-build-and-push:
    name: Build & push Docker image
    needs: [pipeline-and-integration-tests, airflow-dag-validation]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements.txt

      # The Docker image bakes in models/{model.json,scaler.pkl,metadata.json}
      # (see Dockerfile), so they must exist before `docker build` — rerun
      # the real pipeline here rather than reuse the previous job's
      # upload-artifact (keeps this job self-contained and reruns quickly
      # since the dataset is small).
      - name: Run data + feature + train pipeline
        run: |
          python data/generate_data.py
          python data/features.py
          python models/train.py

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Built-in token scoped to this repo — no personal access
          # token needed or stored anywhere for this workflow.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  kubernetes-manifests:
    name: Kubernetes - render, schema-validate, end-to-end on kind
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `kubectl kustomize` is preinstalled on ubuntu runners. Rendering fails on broken
      # references and patches, the cheapest useful check for the overlays.
      - name: Render every kustomization
        run: |
          for d in base overlays/scaled monitoring overlays/full; do
            kubectl kustomize "k8s/$d" > "/tmp/$(basename "$d").yaml"
          done

      - name: Schema-validate with kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -kubernetes-version 1.30.0 /tmp/base.yaml /tmp/scaled.yaml /tmp/monitoring.yaml /tmp/full.yaml
          # ServiceMonitor is a CRD; skip it rather than pull a schema catalog
          ./kubeconform -strict -summary -ignore-missing-schemas k8s/optional/servicemonitor.yaml

      # Real deploy of the FULL stack from the actual pipeline output: the image contains the
      # trained model and models/reference_features.csv. scripts/k8s_e2e.sh then checks shared
      # history across replicas, the drift CronJob (real Evidently), Pushgateway, Prometheus and
      # Grafana provisioning. Read that script's header for the exact list.
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run data + feature + train pipeline
        run: |
          python data/generate_data.py
          python data/features.py
          python models/train.py
      - name: Build image
        run: docker build -t telecom-anomaly-api:ci .
      - uses: helm/kind-action@v1
      - name: Load image and run the end-to-end check
        run: |
          kind load docker-image telecom-anomaly-api:ci
          IMAGE=telecom-anomaly-api:ci scripts/k8s_e2e.sh
