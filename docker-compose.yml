services:
  anomaly-api:
    build: .
    image: telecom-anomaly-detection:latest
    container_name: telecom-anomaly-api
    ports:
      - "8000:8000"
    restart: unless-stopped
    volumes:
      # Inference log (api/inference_log.py) needs to survive container
      # restarts and be readable by monitoring/drift_check.py running on
      # the host — see Phase 4 in README.
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - anomaly-net

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: telecom-anomaly-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    restart: unless-stopped
    depends_on:
      - anomaly-api
      - pushgateway
      - alertmanager
    networks:
      - anomaly-net

  # Routes firing alerts to email. The SMTP server is Mailpit (below), so the demo sends no real mail.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: telecom-anomaly-alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"
    restart: unless-stopped
    depends_on:
      - mailpit
    networks:
      - anomaly-net

  # Local SMTP catcher: receives the alert emails and shows them in a web inbox at :8025.
  mailpit:
    image: axllent/mailpit:v1.21.8
    container_name: telecom-anomaly-mailpit
    ports:
      - "8025:8025"
    restart: unless-stopped
    networks:
      - anomaly-net

  # Batch/scheduled jobs (monitoring/drift_check.py today, Airflow-triggered
  # in Phase 5) push metrics here rather than exposing their own /metrics
  # endpoint, since they don't run continuously — Prometheus scrapes THIS,
  # not the job itself. See prometheus/prometheus.yml's pushgateway job.
  pushgateway:
    image: prom/pushgateway:v1.9.0
    container_name: telecom-anomaly-pushgateway
    ports:
      - "9091:9091"
    restart: unless-stopped
    networks:
      - anomaly-net

  grafana:
    image: grafana/grafana:11.3.0
    container_name: telecom-anomaly-grafana
    environment:
      # Change this in any environment that isn't your own laptop —
      # it's a demo default, not something to run in real production.
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - prometheus
    networks:
      - anomaly-net

networks:
  anomaly-net:
    driver: bridge
    # Explicit fixed name (not left to Compose's implicit
    # <project-name>_anomaly-net prefixing) so docker-compose.airflow.yml
    # can reference it as an external network reliably, regardless of
    # what folder this repo happens to be cloned into.
    name: telecom-anomaly-net

volumes:
  prometheus-data:
  grafana-data:
