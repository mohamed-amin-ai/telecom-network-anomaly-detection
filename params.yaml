# params.yaml
# ------------
# Single source of truth for pipeline + training hyperparameters.
# Read by data/generate_data.py (via env override), models/train.py, and
# tracked as a DVC dependency so `dvc repro` reruns any stage whose
# relevant params changed.

data:
  seed: 42
  cells: ["CELL_001", "CELL_002", "CELL_003"]
  periods_days: 60
  freq_minutes: 15

split:
  train_ratio: 0.8   # time-based: first 80% of the timeline is train+validation, last 20% is TEST
  val_fraction: 0.2  # most recent 20% of that pre-test portion is VALIDATION (early stopping
                     # + threshold tuning). The test set is touched once, for the final report.

model:
  n_estimators: 300
  max_depth: 6
  # Back at the original 0.05. An earlier revision raised this to 0.10 on
  # the strength of a sweep (F1 0.781 -> 0.926) — that finding did NOT
  # survive re-running on the deterministic dataset under a proper
  # train/validation/test protocol, where config differences are within
  # noise. See EXPERIMENTS.md ("Retractions") for the full story.
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  early_stopping_rounds: 30
  random_state: 42

threshold:
  min_recall: 0.93   # production recall floor (missed fault > false alarm)

mlflow:
  experiment_name: "telecom-anomaly-detection"
  registered_model_name: "telecom-anomaly-xgb"
