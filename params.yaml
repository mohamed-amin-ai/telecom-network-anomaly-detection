# params.yaml
# ------------
# Single source of truth for pipeline + training hyperparameters.
# Read by data/generate_data.py (via env override), models/train.py, and
# tracked as a DVC dependency so `dvc repro` reruns any stage whose
# relevant params changed.

data:
  seed: 42
  cells: ["CELL_001", "CELL_002", "CELL_003"]
  periods_days: 60
  freq_minutes: 15

split:
  train_ratio: 0.8   # time-based, first N% for training

model:
  n_estimators: 300
  max_depth: 6
  # Raised from 0.05 -> 0.10 based on results/experiments.json: a real
  # sweep (scripts/local_experiment_sweep.py) on the real generated data
  # showed learning_rate=0.10 lifting F1 from 0.781 -> 0.926 at the same
  # recall floor, by cutting false positives sharply (precision
  # 0.658 -> 0.893). See EXPERIMENTS.md for the full comparison table.
  learning_rate: 0.10
  subsample: 0.8
  colsample_bytree: 0.8
  early_stopping_rounds: 30
  random_state: 42

threshold:
  min_recall: 0.93   # production recall floor (missed fault > false alarm)

mlflow:
  experiment_name: "telecom-anomaly-detection"
  registered_model_name: "telecom-anomaly-xgb"
