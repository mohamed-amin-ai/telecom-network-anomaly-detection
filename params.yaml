# params.yaml
# ------------
# Single source of truth for pipeline + training hyperparameters.
# Read by data/generate_data.py (via env override), models/train.py, and
# tracked as a DVC dependency so `dvc repro` reruns any stage whose
# relevant params changed.

data:
  seed: 42
  cells: ["CELL_001", "CELL_002", "CELL_003"]
  periods_days: 730   # was 60. Anomaly EVENTS now scale with this (generate_data.py), so
                      # validation/test windows hold dozens of events instead of ~2 and ~6.
  freq_minutes: 15

  # "legacy"    = the original clean-room generator (byte-identical to before profiles existed):
  #               simple step-change anomalies, perfect labels, stationary data. An UPPER BOUND —
  #               it reproduces the ORIGINAL project's metric level, and is the configured default.
  # "realistic" = adds the difficulty factors below. Each switch is independent, so
  #               scripts/realism_study.py can show how much each one moves the numbers.
  #
  # "calibrated" = ALIAS for the realistic code path with only `severity_and_ramp` on, every fault
  #               at full strength, and the onset ramp set by data.calibrated.ramp_fraction below.
  #               The ramp, timeline length and operating point were chosen on DEVELOPMENT seeds by
  #               scripts/target_window_search.py so results fall in a realistic window (row recall
  #               95-98%, precision 75-85%), then reported on separate seeds. The window is a target
  #               set by the project owner, so landing in it is BY CONSTRUCTION — not independent
  #               evidence of model quality. This is the configured default.
  #
  # SWITCHING PROFILE: also set threshold.validation_recall_target to that level's value
  # (legacy -> 0.96, calibrated -> 0.965, realistic -> 0.5; each chosen by its study script).
  # A test fails if only one of the two was changed.
  profile: calibrated
  calibrated:
    severity_min: 1.0     # fixed: every fault at full strength
    ramp_fraction: 0.075    # chosen on DEV seeds by scripts/target_window_search.py (see results/target_window_search.json)

  realism:
    # Every value below is a judgment call about what real telemetry looks like — NOT calibrated
    # to any production system (none was available).
    #
    # History, stated plainly: the values were first fixed BEFORE any model was trained on this
    # profile (severity_min 0.15, benign_to_fault_ratio 1.0). That setting turned out to be
    # degenerate (PR-AUC ~0.2 on a development seed; ~3.7 false alerts per cell-day at 50% recall).
    # It is kept and reported as the "harsh" level (scripts/recall_target_study.py). The two values
    # below were then revised ONCE, post hoc, to a milder setting; that is the default. No further
    # revisions were made after seeing the default's results. All three levels are reported
    # side by side so the sensitivity is visible rather than hidden behind one chosen number.
    nonstationarity: true         # per-cell baselines, weekly seasonality, slow drift
    severity_and_ramp: true       # faults range from barely-visible to dramatic, with gradual onset
    label_noise: true             # ticket-derived labels: jittered boundaries + some faults never logged
    benign_surges: true           # real but non-fault episodes that resemble mild faults
    severity_min: 0.4             # weakest fault is 40% of the legacy magnitude (log-uniform up to 100%); harsh level: 0.15
    ramp_fraction: 0.3            # effect ramps in over the first 30% of an event
    label_jitter_intervals: 2     # label start/end off by up to +/-2 intervals (30 min)
    unlabeled_fault_prob: 0.10    # 10% of real faults never get labeled
    benign_to_fault_ratio: 0.5    # one benign surge per two real faults; harsh level: 1.0
    cell_scale_range: [0.8, 1.25] # per-cell latency/throughput scale
    latency_drift_pct: 10         # latency creeps +10% over the timeline
    throughput_drift_pct: -8      # throughput erodes 8% over the timeline

split:
  train_ratio: 0.8   # time-based: first 80% of the timeline is train+validation, last 20% is TEST
  val_fraction: 0.2  # most recent 20% of that pre-test portion is VALIDATION (early stopping
                     # + threshold tuning). The test set is touched once, for the final report.

model:
  n_estimators: 300
  max_depth: 6
  # Back at the original 0.05. An earlier revision raised this to 0.10 on
  # the strength of a sweep (F1 0.781 -> 0.926) — that finding did NOT
  # survive re-running on the deterministic dataset under a proper
  # train/validation/test protocol, where config differences are within
  # noise. See EXPERIMENTS.md ("Retractions") for the full story.
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  early_stopping_rounds: 30
  random_state: 42

threshold:
  # Two different numbers, deliberately:
  #   validation_recall_target: what the threshold is TUNED to hit on the validation slice.
  #     Chosen by a rule stated in advance — maximise median row-level F2 on DEVELOPMENT seeds —
  #     for the default data profile, then evaluated on separate seeds. See
  #     scripts/recall_target_study.py and EXPERIMENTS.md. A test keeps this equal to the
  #     study's result for the level data.profile selects. F2 rule: 0.96 on the clean benchmark,
  #     0.5 on the realistic one. For the calibrated profile the target (0.965) comes from
  #     scripts/target_window_search.py (dev seeds): recall fully inside 95-98% and median precision
  #     closest to 80%.
  #   min_recall: the production floor a model must meet on the held-out TEST window to be
  #     promoted (models/promote.py). Reachable on most draws of the clean benchmark; NOT
  #     reachable at a usable alert rate on the realistic one — see README "What this means for
  #     promotion". Left unchanged: it is a business requirement, not something to tune to
  #     whatever the model achieves.
  validation_recall_target: 0.965
  min_recall: 0.93   # production recall floor (missed fault > false alarm)

mlflow:
  experiment_name: "telecom-anomaly-detection"
  registered_model_name: "telecom-anomaly-xgb"
