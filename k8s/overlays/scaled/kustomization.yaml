# CPU autoscaling for the API (2-6 replicas). Safe because history and the inference log are
# shared through Redis (see base/). The Redis Deployment itself stays at one replica.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: telecom-anomaly   # also applies to hpa.yaml, which carries no namespace
resources:
  - ../../base
  - hpa.yaml
patches:
  # The HPA owns the replica count. Leaving `replicas: 2` in the Deployment would reset the
  # autoscaler's decision to 2 on every `kubectl apply`.
  - target: {kind: Deployment, name: anomaly-api}
    patch: |-
      - op: remove
        path: /spec/replicas
