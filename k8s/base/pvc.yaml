# Inference log (api/inference_log.py -> /app/logs/inference_log.csv). monitoring/drift_check.py
# reads it, so it should outlive pod restarts. ReadWriteOnce: fine for one replica (the base
# deployment's only mode); the `scaled` overlay swaps it for an emptyDir — see its README note.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: anomaly-api-logs
  labels:
    app.kubernetes.io/name: anomaly-api
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
