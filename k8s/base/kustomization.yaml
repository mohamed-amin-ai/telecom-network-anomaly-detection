apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: telecom-anomaly
resources:
  - namespace.yaml
  - redis.yaml
  - deployment.yaml
  - service.yaml
  - pdb.yaml
# Pin the image to the commit CI built, e.g.:
#   cd k8s/overlays/full && kustomize edit set image ghcr.io/mohamed-amin-ai/mlops-anomaly=ghcr.io/mohamed-amin-ai/mlops-anomaly:<sha>
images:
  - name: ghcr.io/mohamed-amin-ai/mlops-anomaly
    newTag: latest
