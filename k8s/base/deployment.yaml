apiVersion: apps/v1
kind: Deployment
metadata:
  name: anomaly-api
  labels:
    app.kubernetes.io/name: anomaly-api
    app.kubernetes.io/part-of: telecom-anomaly-detection
spec:
  # More than one replica is only correct because REDIS_URL (below) moves per-cell history and the
  # inference log into the shared Redis (api/shared_store.py). Without it every replica would hold
  # a fraction of a cell's readings and keep answering 425. tests/test_k8s_manifests.py enforces
  # "replicas > 1 requires REDIS_URL".
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app.kubernetes.io/name: anomaly-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anomaly-api
        app.kubernetes.io/part-of: telecom-anomaly-detection
        telecom-anomaly/redis-client: "true"     # lets the redis NetworkPolicy admit this pod
      annotations:
        # Picked up by annotation-based Prometheus scrape configs. With the Prometheus
        # Operator use k8s/optional/servicemonitor.yaml instead.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000          # the image's appuser (Dockerfile: useradd --uid 1000)
        runAsGroup: 1000
        fsGroup: 1000            # makes the log volume writable by that user
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas over nodes when possible (soft: a single-node cluster still schedules both).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: anomaly-api
      containers:
        - name: api
          image: ghcr.io/mohamed-amin-ai/mlops-anomaly:latest  # pin a commit SHA via the kustomize `images:` block
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
            # Optional shared-secret auth for /predict, /predict/batch, /model/info (api/auth.py).
            # Secret absent => routes stay open. Create:  kubectl -n telecom-anomaly create secret generic api-keys --from-literal=keys='k1,k2'
            - name: API_KEYS
              valueFrom:
                secretKeyRef:
                  name: api-keys
                  key: keys
                  optional: true
          # The image's own HEALTHCHECK is ignored by Kubernetes; these replace it.
          # The model is loaded at import time, so give startup room before liveness applies.
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            # Measured with scripts/measure_resources.py on the REAL XGBoost image (4 concurrent clients,
            # warmed cells, shared CI runner): 233 MiB idle / 240 MiB peak RSS, 24-53 ms CPU per scored
            # request, one process serves 23-50 req/s (feature engineering over the cell history dominates).
            # Memory request 320Mi (~1.3x peak), limit 512Mi (~2.1x). CPU limit 1 = what one uvicorn process
            # can use. The HPA's 70% target is of the 500m CPU request; its scale-out was verified on kind.
            requests: {cpu: 500m, memory: 320Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
