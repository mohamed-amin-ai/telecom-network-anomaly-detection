apiVersion: apps/v1
kind: Deployment
metadata:
  name: anomaly-api
  labels:
    app.kubernetes.io/name: anomaly-api
    app.kubernetes.io/part-of: telecom-anomaly-detection
spec:
  # More than one replica is only correct because REDIS_URL (below) moves per-cell history and the
  # inference log into the shared Redis (api/shared_store.py). Without it every replica would hold
  # a fraction of a cell's readings and keep answering 425. tests/test_k8s_manifests.py enforces
  # "replicas > 1 requires REDIS_URL".
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app.kubernetes.io/name: anomaly-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: anomaly-api
        app.kubernetes.io/part-of: telecom-anomaly-detection
        telecom-anomaly/redis-client: "true"     # lets the redis NetworkPolicy admit this pod
      annotations:
        # Picked up by annotation-based Prometheus scrape configs. With the Prometheus
        # Operator use k8s/optional/servicemonitor.yaml instead.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000          # the image's appuser (Dockerfile: useradd --uid 1000)
        runAsGroup: 1000
        fsGroup: 1000            # makes the log volume writable by that user
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas over nodes when possible (soft: a single-node cluster still schedules both).
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: anomaly-api
      containers:
        - name: api
          image: ghcr.io/mohamed-amin-ai/telecom-network-anomaly-detection:latest  # pin a commit SHA via the kustomize `images:` block
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: REDIS_URL
              value: redis://redis:6379/0
          # The image's own HEALTHCHECK is ignored by Kubernetes; these replace it.
          # The model is loaded at import time, so give startup room before liveness applies.
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          # Starting values, NOT measured. Load-test and adjust.
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
